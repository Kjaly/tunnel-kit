# Барьер от случайного коммита секретов (распознаваемых ключей и токенов; не любых IP).
# Установка (один раз): pipx install pre-commit && pre-commit install
# Проверить весь репо вручную: pre-commit run --all-files
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
