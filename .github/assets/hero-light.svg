<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="tunnel-kit — свой VPN на VLESS + Reality с раздельным туннелированием">
  <style>
    .wm { font: 700 76px ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2328; letter-spacing: -2px; }
    .tag { font: 400 25px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #59636e; }
    .lbl { font: 500 17px ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; }
    .sub { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #818b98; }
    .flow { fill: none; stroke-width: 2.5; stroke-linecap: round; }
  </style>

  <!-- wordmark -->
  <text class="wm" x="72" y="150">tunnel-kit</text>
  <text class="tag" x="76" y="196">Свой VPN на VLESS + Reality</text>
  <text class="tag" x="76" y="228">с раздельным туннелированием</text>
  <rect x="76" y="252" width="96" height="3" rx="1.5" fill="#1a7f37"/>

  <!-- источник -->
  <rect x="604" y="128" width="44" height="66" rx="7" fill="none" stroke="#59636e" stroke-width="2.5"/>
  <rect x="618" y="140" width="16" height="3" rx="1.5" fill="#59636e"/>
  <circle cx="626" cy="182" r="3" fill="#59636e"/>

  <!-- три пути -->
  <path class="flow" stroke="#1a7f37" d="M 660 148 C 726 148 738 84 806 84"/>
  <path class="flow" stroke="#0969da"  d="M 660 161 C 740 161 746 161 806 161"/>
  <path class="flow" stroke="#cf222e"   d="M 660 174 C 726 174 738 238 806 238" stroke-dasharray="1 9"/>

  <!-- назначения -->
  <rect x="818" y="60" width="304" height="48" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
  <path d="M 843 72 l 15 -6 15 6 v 11 c 0 9 -7 15 -15 18 -8 -3 -15 -9 -15 -18 z" fill="none" stroke="#1a7f37" stroke-width="2.2" stroke-linejoin="round"/>
  <text class="lbl" x="886" y="82" fill="#1f2328">ChatGPT · Google</text>
  <text class="sub" x="886" y="99">через чистый ASN</text>

  <rect x="818" y="137" width="304" height="48" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
  <path d="M 843 161 h 26 m -9 -9 l 9 9 -9 9" fill="none" stroke="#0969da" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="lbl" x="886" y="159" fill="#1f2328">Банки · App Store · .ru</text>
  <text class="sub" x="886" y="176">напрямую, мимо VPN</text>

  <rect x="818" y="214" width="304" height="48" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
  <path d="M 848 232 l 18 18 m 0 -18 l -18 18" fill="none" stroke="#cf222e" stroke-width="2.2" stroke-linecap="round"/>
  <text class="lbl" x="886" y="236" fill="#1f2328">Реклама · трекеры</text>
  <text class="sub" x="886" y="253">отбрасываются</text>
</svg>
